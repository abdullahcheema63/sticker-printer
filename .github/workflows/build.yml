name: Build Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - "sticker_printer.py"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller pywin32

      - name: Build exe
        run: pyinstaller --onefile --windowed --name StickerPrinter-${{ matrix.arch }} sticker_printer.py

      - uses: actions/upload-artifact@v4
        with:
          name: StickerPrinter-${{ matrix.arch }}
          path: dist/StickerPrinter-${{ matrix.arch }}.exe
